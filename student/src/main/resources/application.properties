spring.application.name=student
# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Render injects DB_* env vars via fromDatabase. Fall back to localhost for local dev.
spring.datasource.url=${DB_HOST:jdbc:postgresql://localhost:5432/db_student}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optimizes the SQL generation specifically for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prints executed SQL queries to the console log (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${SERVER_PORT:8080}