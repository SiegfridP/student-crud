services:
  # ── Backend (Spring Boot via Docker) ─────────────────────────────────────────
  - type: web
    name: student-crud-backend
    runtime: docker
    dockerfilePath: ./student/Dockerfile
    dockerContext: ./student
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: student-crud-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: student-crud-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: student-crud-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: student-crud-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: student-crud-db
          property: password
      - key: SERVER_PORT
        value: "8080"

  # ── Frontend (Vite + React Static Site) ──────────────────────────────────────
  - type: web
    name: student-crud-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://student-crud-backend-4ivq.onrender.com

databases:
  - name: student-crud-db
    databaseName: db_student